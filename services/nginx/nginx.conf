server {

    listen 80;
    
    rewrite ^(.+)/$ $1 last;

    location / {
        proxy_pass http://web:42069/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
    
    location /static/ {
        alias /www/app/static/;
    }

    location /media/ {
        alias /www/user/media/;
    }
}