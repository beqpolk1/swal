services:
    web:
        build: ./services/web
        command: gunicorn --reload -w 4 -b 0.0.0.0:42069 app:app
        volumes:
            - ./services/web:/app
        expose:
            - 42069
            
    nginx:
        build: ./services/nginx
        ports:
            - 7007:80
        depends_on:
            - web
            
